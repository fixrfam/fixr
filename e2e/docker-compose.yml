# Dedicated, throwaway infra for e2e. Different ports from packages/db's
# dev compose and tmpfs storage, so e2e can never touch the dev database.
name: fixr-e2e

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: e2e
      MYSQL_DATABASE: fixr_e2e
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ue2e", "-pe2e"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
