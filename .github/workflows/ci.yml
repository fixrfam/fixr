name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# New pushes to a PR cancel the previous run (deploy.yml does the opposite on purpose).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every suite uses its own deterministic, non-secret test env (apps/server/test/env.ts,
  # e2e/support/env.ts). No production secret is ever needed or exposed here.
  BUN_VERSION: 1.3.6

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint:ci

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-types:ci

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Vitest 4 / Vite 8 need Node >= 20.19; pin it instead of relying on the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Runs every workspace's unit tests with coverage; thresholds fail the job.
      - run: bun run test:ci
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
            !**/node_modules/**
          retention-days: 14

  test-integration:
    name: Integration tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vitest 4 / Vite 8 need Node >= 20.19; pin it instead of relying on the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # ubuntu-latest ships with Docker, which Testcontainers uses for MySQL and Redis.
      - run: bun run test:integration

  test-e2e:
    name: E2E tests
    # E2E is the slowest suite: run it on PRs to main, pushes to develop/main and on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Vitest 4 / Vite 8 need Node >= 20.19; pin it instead of relying on the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: Stop e2e containers
        if: always()
        working-directory: e2e
        run: docker compose -f docker-compose.yml down -v
